name: Gerar APK SignageBox Expo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Descompactar projeto Expo
        run: |
          unzip -o "tv box mod.zip" -d temp_extract
          PKG_PATH=$(find temp_extract -name "package.json" | head -n 1)
          PROJECT_DIR=$(dirname "$PKG_PATH")
          cp -r "$PROJECT_DIR"/* .
          rm -rf temp_extract

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências e gerar Android
        run: |
          npm install
          npx expo prebuild --platform android --no-install

      - name: Compilar APK Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: signagebox-tv-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          
