name: Gerar APK SignageBox

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Descompactar e organizar projeto
        run: |
          unzip -o signagebox-voltbuilder.zip -d temp_extract
          CONFIG_PATH=$(find temp_extract -name "config.xml" | head -n 1)
          PROJECT_DIR=$(dirname "$CONFIG_PATH")
          cp -r "$PROJECT_DIR"/* .
          rm -rf temp_extract
          mkdir -p resources
          if [ ! -f resources/icon.png ] && [ -f www/images/icon.png ]; then
            cp www/images/icon.png resources/icon.png
          fi
          ls -la
          ls -la resources/

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Cordova e compilar APK
        run: |
          npm init -y
          npm install -g cordova
          cordova platform add android
          cordova prepare android
          cordova build android

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: signagebox-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
